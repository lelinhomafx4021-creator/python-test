# AI-Investor 开发环境 - Docker Compose
# 一个命令拉起所有基础设施: docker-compose up -d

services:
  # ============================================================
  # PostgreSQL 16 + pgvector 扩展
  # ============================================================
  # 用官方的 pgvector 镜像，自带 vector 扩展，不需要手动安装
  # 一个库搞定：关系型数据 + 向量检索 + 对话记录 + AgentState
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_investor_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_investor         # 自动创建的数据库名
      POSTGRES_USER: postgres          # 用户名
      POSTGRES_PASSWORD: "123456"      # 密码（生产环境要用强密码）
    volumes:
      # 数据持久化：容器删了数据还在
      # 用 named volume 比挂载目录更安全
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ============================================================
  # Redis 7
  # ============================================================
  # 用途：语义缓存 + 会话管理 + 限流（后续用）
  redis:
    image: redis:7-alpine
    container_name: ai_investor_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

# named volume 定义
volumes:
  pgdata:
