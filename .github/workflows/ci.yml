name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
  pull_request:

jobs:
  java-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java tests
        run: mvn -q test

  python-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aipy2
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_investor_test
      DASH_API_KEY: test-key
      DEEPSEEK_API: test-key
      LANGFUSE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install test tools
        run: uv pip install --python .venv/bin/python pytest pytest-asyncio httpx
      - name: Run Python tests
        run: uv run python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
