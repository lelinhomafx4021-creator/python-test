app:
  email:
    mock-enabled: false

  # 建议把本机专用凭据写到 application-local.yml，不要提交到仓库。

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_investor?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: your_mysql_username
    password: your_mysql_password
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: your_rabbitmq_username
    password: your_rabbitmq_password
  mail:
    host: smtp.qq.com
    port: 465
    username: your_email@qq.com
    password: your_authorization_code
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            enable: true
