server:
  port: 8080

spring:
  application:
    name: java-ai-gateway
  
  # --- 数据库连接池优化 (面试加分点：懂连接池管理) ---
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_investor?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10          # 最大连接数，开发环境 10 够用
      minimum-idle: 5                # 最小空闲连接
      connection-timeout: 30000      # 等待连接池分配连接的最大时长（30秒）
      max-lifetime: 1800000          # 一个连接在池里的最长存活时间
      idle-timeout: 600000           # 连接退出的闲置时长
  
  # --- Flyway 自动化建表配置 ---
  flyway:
    baseline-on-migrate: true
    enabled: true

  # --- 统一 JSON 返回格式 ---
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # --- RabbitMQ 配置 ---
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: rabbitmq
    password: rabbitmq
mybatis-plus:
  configuration:
    map-underline-to-camel-case: true
    # 【开发利器】开启控制台 SQL 日志输出，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# --- Python 侧服务配置 ---
python:
  ai:
    base-url: http://localhost:8000

app:
  mq:
    audit-exchange: ai.chat.audit.exchange
    audit-routing-key: ai.chat.audit.routing

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics




