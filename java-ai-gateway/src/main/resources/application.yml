server:
  port: 8080

spring:
  application:
    name: java-ai-gateway
  config:
    import: optional:classpath:application-local.yml

  # --- 数据库连接池优化（主业务真相存储） ---
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_investor?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10          # 最大连接数，开发环境 10 够用
      minimum-idle: 5                # 最小空闲连接
      connection-timeout: 30000      # 等待连接池分配连接的最大时长（30秒）
      max-lifetime: 1800000          # 一个连接在池里的最长存活时间
      idle-timeout: 600000           # 连接退出的闲置时长

  # --- Redis：登录态、热点行情、配额计数、分布式锁 ---
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1

  # --- Flyway 自动化建表配置 ---
  flyway:
    baseline-on-migrate: true
    enabled: true

  # --- 统一 JSON 返回格式 ---
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # --- RabbitMQ 配置 ---
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cloud:
    # 本地开发阶段先关闭 Spring Cloud 与 Spring Boot 的版本拦截，
    # 避免 Sentinel 接入时因为版本校验阻塞整套项目启动。
    compatibility-verifier:
      enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
      eager: true
      filter:
        enabled: true
mybatis-plus:
  configuration:
    map-underline-to-camel-case: true
    # 【开发利器】开启控制台 SQL 日志输出，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# --- Python 侧服务配置 ---
python:
  ai:
    base-url: http://localhost:8000

app:
  cache:
    market-quote-ttl-seconds: 30
    account-lock-seconds: 10
  email:
    mock-enabled: ${APP_EMAIL_MOCK_ENABLED:true}
  mq:
    audit-exchange: ai.chat.audit.exchange
    audit-routing-key: ai.chat.audit.routing
    transaction-exchange: transaction.event.exchange
    transaction-routing-key: transaction.event

aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
    directory: avatar


management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# --- SpringDoc OpenAPI (Swagger UI) 配置 ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
