services:
  mysql:
    image: mysql:8.0
    container_name: ai-investor-mysql
    restart: unless-stopped
    command:
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_investor
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: ai-investor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ai-investor-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: ankane/pgvector:latest
    container_name: ai-investor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ai_investor
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: ai-investor-langfuse
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/ai_investor
      NEXTAUTH_SECRET: 123456
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_NAME: AI-Investor
      LANGFUSE_INIT_PROJECT_NAME: Interview-Demo
      LANGFUSE_INIT_USER_EMAIL: admin@local.test
      LANGFUSE_INIT_USER_PASSWORD: 123456
    ports:
      - "3000:3000"

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: ai-investor-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  postgres_data:
